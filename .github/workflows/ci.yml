name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Build and test on the three platforms the project ships, with CGO off,
  # which is how the released binaries are built.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  # The race detector needs cgo and a C toolchain, so it gets its own job
  # rather than complicating the matrix above. The shipped binaries are
  # still CGO_ENABLED=0; this job only proves the concurrency is sound.
  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - run: go test ./... -count=1 -race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      # staticcheck and govulncheck are installed as tools, never added to
      # go.mod, so they do not count against the dependency budget that
      # internal/boundary enforces.
      #
      # staticcheck is pinned. At @latest a new release can turn this repository
      # red with no contributor change, and CONTRIBUTING says in as many words
      # that a failing check is not to be loosened to get past it - which puts a
      # contributor between an unrelated red build and a rule. Bump this line
      # deliberately, as its own commit, and fix what the new version finds.
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
      - run: staticcheck ./...
      # govulncheck stays at @latest on purpose, and for the opposite reason: what
      # it reports comes from a vulnerability database that is meant to be newer
      # than the pin. A stale vulnerability scanner is not a stable one.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      # goreleaser's config is validated on every push rather than first
      # discovered to be wrong at tag time, when the fix costs a new tag. The v2
      # 'formats:' spelling is the sort of thing this catches.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  cross-compile:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: build every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/bkmr
          done
